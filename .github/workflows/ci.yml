name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q

  # Full policy comparison against simulated replicas (small trace) to make
  # sure the router, mock engine and benchmark harness work together.
  smoke-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m kvroute.bench --mock 3 --kind chat --scale 0.1 --rate-scale 4 --policies round_robin,lmetric --mock-args "--time-scale 0.2" --out-dir ci-results
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-bench
          path: ci-results
