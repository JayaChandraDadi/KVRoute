# Same stack with simulated replicas: no GPU needed (runs on a laptop).
#
#   cd deploy && docker compose -f docker-compose.mock.yml up -d --build
#   python -m kvroute.bench --router http://localhost:8000 --kind agent
#
# Service names match docker-compose.yml so the Prometheus config and
# Grafana dashboard are shared.

x-mock: &mock
  build: ..
  entrypoint: ["kvroute-mock"]
  command: ["--host=0.0.0.0", "--port=8000", "--num-gpu-blocks=2048"]

services:
  vllm0: *mock
  vllm1: *mock
  vllm2: *mock
  vllm3: *mock

  router:
    build: ..
    command:
      - --replicas=http://vllm0:8000,http://vllm1:8000,http://vllm2:8000,http://vllm3:8000
      - --policy=${POLICY:-lmetric}
      - --tokenizer=word
      - --port=8000
    ports: ["8000:8000"]
    depends_on: [vllm0, vllm1, vllm2, vllm3]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
