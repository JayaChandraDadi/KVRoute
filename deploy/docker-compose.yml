# KVRoute in front of 4 vLLM replicas, with Prometheus and Grafana.
#
#   cd deploy && docker compose up -d --build
#   curl localhost:8000/router/stats
#   python -m kvroute.bench --router http://localhost:8000 --kind chat --model "$MODEL"
#
# One GPU per replica by default. On a single GPU, run all four replicas on
# it with a small model:
#   GPU_0=0 GPU_1=0 GPU_2=0 GPU_3=0 GPU_UTIL=0.2 docker compose up -d --build
#
# VLLM_SERVER_DEV_MODE=1 enables POST /reset_prefix_cache, which the
# benchmark uses to start every policy run from a cold cache.

x-vllm: &vllm
  image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
  ipc: host
  environment:
    VLLM_SERVER_DEV_MODE: "1"
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
  command:
    - --model=${MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
    - --served-model-name=${MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
    - --enable-prefix-caching
    - --block-size=16
    - --gpu-memory-utilization=${GPU_UTIL:-0.85}
    - --max-model-len=${MAX_MODEL_LEN:-8192}
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
    interval: 10s
    timeout: 5s
    retries: 60
    start_period: 60s

services:
  vllm0:
    <<: *vllm
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["${GPU_0:-0}"], capabilities: [gpu] }]
  vllm1:
    <<: *vllm
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["${GPU_1:-1}"], capabilities: [gpu] }]
  vllm2:
    <<: *vllm
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["${GPU_2:-2}"], capabilities: [gpu] }]
  vllm3:
    <<: *vllm
    deploy:
      resources:
        reservations:
          devices: [{ driver: nvidia, device_ids: ["${GPU_3:-3}"], capabilities: [gpu] }]

  router:
    build: ..
    command:
      - --replicas=http://vllm0:8000,http://vllm1:8000,http://vllm2:8000,http://vllm3:8000
      - --policy=${POLICY:-lmetric}
      - --tokenizer=hf:${MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      - --block-size=16
      - --port=8000
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    ports: ["8000:8000"]
    depends_on:
      vllm0: { condition: service_healthy }
      vllm1: { condition: service_healthy }
      vllm2: { condition: service_healthy }
      vllm3: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
